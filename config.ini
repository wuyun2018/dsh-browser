; ============================================================
;  DSH 浏览器 配置文件
;  修改后保存，下次打开“DSH 浏览器”生效。
; ============================================================
; ------------------------------------------------------------
;  隐私说明（重要）
;  logs\  会记录启动日志（已对令牌脱敏）；profile\ 是浏览器用户数据目录，
;  可能含 DSH 登录态、浏览历史、Cookie、Microsoft 账号登录信息等。
;  把本目录发给别人 / 上传网盘 / 打包分发之前，请先双击
;  「清理隐私数据.cmd」（完整模式），并确认 logs\、profile\、state\ 已清理。
;  令牌说明：DSH 每次启动会生成新的 ?token=*** 地址；
;  本项目已对日志脱敏，但浏览器进程命令行中仍会短暂出现令牌。
; ------------------------------------------------------------

; DSH Web 端口（与一键启动脚本一致，默认 3080）
PORT=3080

; 浏览器可执行文件路径。
; 留空 = 自动使用系统 Microsoft Edge（本机实测内存最低）；
;        如需改用其它 Chromium 内核浏览器，填写其 exe 的完整路径
;        （可写相对本目录的路径，如 browser\chrome.exe）。
BROWSER_PATH=

; 额外浏览器启动参数（空格分隔，可留空）
; 默认参数已包含：应用窗口模式、独立配置目录、关闭扩展/同步/后台联网、禁用 GPU 等
EXTRA_FLAGS=

; 关闭浏览器窗口时是否同步停止 DSH 服务（由轻量监视器 watchdog.exe 执行）：
;   1 = 停止（默认；更省内存。会断开其它已打开的 DSH 页面，但会话记录不会丢）
;   0 = 保留（需要和其它客户端共享同一个 DSH 服务时使用）
STOP_SERVER_ON_CLOSE=1

; 浏览器窗口大小
WINDOW_SIZE=1280,900

; 浏览器用户数据目录（留空 = 本目录下的 profile）
PROFILE_DIR=

; 原一键启动脚本（负责启动 dsh web 并生成带令牌的访问地址）
; 留空 = 自动探测，按顺序：
;   1) ..\dsh-launcher\start-dsh-web.mjs（与本项目同级的 dsh-launcher，推荐）
;   2) D:\tools\dsh-launcher\start-dsh-web.mjs（默认安装位置）
; 也可以写绝对路径，或相对本项目根目录的路径。
LAUNCHER_SCRIPT=

; node.exe 路径（留空 = 从 PATH 自动查找）
NODE_PATH=

; dsh 命令路径（留空 = 由一键启动脚本使用默认 %APPDATA%\npm\dsh.cmd）
DSH_CMD=

; DSH 工作目录（留空 = %USERPROFILE%\Documents\deepseek-harness\default-workspace，跨机器可用）
WORKSPACE=

; 令牌状态目录（留空 = %LOCALAPPDATA%\dsh-web）
STATE_DIR=
